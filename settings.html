<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知設定 | フォーム工房</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Zen Maru Gothic', sans-serif; } </style>
</head>
<body class="bg-amber-50/30 text-slate-700 min-h-screen flex flex-col">

    <header class="bg-white/80 backdrop-blur border-b-2 border-amber-100 px-6 py-3 flex justify-between items-center sticky top-0 z-30">
        <div class="flex items-center space-x-3">
            <a href="builder.html" class="bg-pink-500 text-white font-black px-3 py-1.5 rounded-2xl text-lg shadow-sm -rotate-2 inline-block">🎨 フォーム工房</a>
            <span class="text-xs font-bold text-slate-400">通知設定</span>
        </div>
        <div class="flex items-center space-x-3">
            <a href="forms.html" class="px-3.5 py-2 text-xs font-black text-slate-700 bg-amber-100 rounded-xl">📋 マイフォーム</a>
        </div>
    </header>

    <main class="max-w-xl mx-auto w-full p-6 space-y-6">
        <h1 class="text-2xl font-black text-slate-800">🔔 通知設定</h1>

        <div class="bg-white rounded-3xl p-6 border-2 border-slate-100 shadow-sm space-y-5">
            <div class="space-y-2">
                <label class="text-xs font-black text-slate-700 flex items-center space-x-1">
                    <span>Discord Webhook URL</span>
                </label>
                <input type="url" id="webhookUrl" placeholder="https://discord.com/api/webhooks/..." class="w-full px-4 py-2.5 bg-slate-50 border-2 border-slate-200 rounded-xl text-xs font-bold focus:outline-none focus:border-pink-400">
                <p class="text-[10px] text-slate-400 font-bold leading-relaxed">
                    Discordのチャンネル設定 ＞ 連携サービス ＞ Webhook からURLを作成して貼り付けてください。<br>
                    登録すると、**どのフォームから依頼が届いてもこのチャンネルに即時通知**されます。
                </p>
            </div>

            <div class="flex space-x-3 pt-2">
                <button onclick="saveSettings()" class="flex-1 py-3 bg-pink-500 hover:bg-pink-600 text-white font-black text-xs rounded-xl shadow-md transition">保存する</button>
                <button onclick="testWebhook()" class="px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-black text-xs rounded-xl transition">テスト送信</button>
            </div>
        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const user = await AuthApp.getUser();
            if (!user) {
                alert("ログインが必要です");
                window.location.href = 'builder.html';
                return;
            }
            const profile = await LocalDB.getProfileAsync();
            if (profile && profile.discord_webhook_url) {
                document.getElementById('webhookUrl').value = profile.discord_webhook_url;
            }
        });

        async function saveSettings() {
            const url = document.getElementById('webhookUrl').value.trim();
            const success = await LocalDB.saveProfileAsync(url);
            if (success) {
                alert("設定を保存しました！");
            } else {
                alert("保存に失敗しました。");
            }
        }

        async function testWebhook() {
            const url = document.getElementById('webhookUrl').value.trim();
            if (!url) return alert("Webhook URLを入力してください。");

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: "🔔 テスト通知",
                            description: "フォーム工房からの通知テストです！正常に連携されています。",
                            color: 15510223
                        }]
                    })
                });
                if (res.ok) alert("テスト通知を送信しました！Discordを確認してください。");
                else alert("送信に失敗しました。URLを確認してください。");
            } catch (err) {
                alert("エラーが発生しました: " + err.message);
            }
        }
    </script>
</body>
</html>
