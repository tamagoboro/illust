<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>送信済み依頼履歴 | フォーム工房</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style> body { font-family: 'Zen Maru Gothic', sans-serif; } </style>
</head>
<body class="bg-amber-50/40 text-slate-700 min-h-screen p-6">
  <div class="max-w-3xl mx-auto space-y-6">
    <div class="flex justify-between items-center bg-white p-6 rounded-3xl border-2 border-slate-100 shadow-sm">
      <h2 class="text-xl font-black text-slate-800">📤 送信済み依頼履歴</h2>
      <button onclick="AuthApp.logout()" class="px-3.5 py-2 text-xs font-black text-slate-500 bg-slate-100 hover:bg-slate-200 rounded-xl transition">ログアウト</button>
    </div>

    <div id="historyContainer" class="space-y-4">読み込み中...</div>
  </div>

  <script>
    async function init() {
      const user = await AuthApp.getUser();
      if (!user) {
        alert("ログインが必要です");
        window.location.href = 'builder.html';
        return;
      }

      const container = document.getElementById('historyContainer');
      const requests = await LocalDB.getClientProjectsAsync(user.email);

      if (requests.length === 0) {
        container.innerHTML = `<div class="bg-white p-8 rounded-3xl text-center text-xs font-bold text-slate-400 border-2 border-slate-100">送信した依頼はありません。</div>`;
        return;
      }

      container.innerHTML = requests.map(r => {
        const answersList = Array.isArray(r.answers) ? r.answers : [];
        return `
          <div class="bg-white p-6 rounded-3xl border-2 border-slate-100 shadow-sm space-y-3">
            <div class="flex justify-between items-center border-b pb-3 border-slate-100">
              <span class="font-black text-xs text-pink-500">フォームID: ${r.form_handle}</span>
              <span class="text-sm font-black text-slate-800">概算: ¥${Number(r.total_price || 0).toLocaleString()}</span>
            </div>
            <div class="text-[10px] font-bold text-slate-400">送信日時: ${new Date(r.created_at).toLocaleString('ja-JP')}</div>
            <div class="bg-slate-50 p-3 rounded-2xl space-y-1.5 text-xs">
              ${answersList.map(a => `
                <div class="flex justify-between border-b border-slate-200/50 pb-1 last:border-none">
                  <b class="text-slate-500">${a.label}:</b>
                  <span class="text-slate-700 font-bold">${a.value || '-'}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    init();
  </script>
</body>
</html>
