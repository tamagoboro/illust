<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>依頼管理ダッシュボード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Zen Maru Gothic', sans-serif; } </style>
</head>
<body class="bg-amber-50/30 text-slate-700 min-h-screen flex flex-col">

    <header class="bg-white/80 backdrop-blur border-b-2 border-amber-100 px-6 py-3 flex justify-between items-center sticky top-0 z-30">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="bg-pink-500 text-white font-black px-3 py-1.5 rounded-2xl text-lg shadow-sm -rotate-2 inline-block">🎨 フォーム工房</a>
            <span class="text-xs font-bold text-slate-400">依頼管理ダッシュボード</span>
        </div>
        <div class="flex items-center space-x-3">
            <a href="index.html" class="px-3.5 py-2 text-xs font-black text-slate-700 bg-amber-100 rounded-xl">✏️ ビルダーへ戻る</a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto w-full p-6 space-y-6">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-black text-slate-800">📥 届いた依頼一覧</h1>
            <button onclick="loadOrders()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold rounded-xl transition">🔄 更新</button>
        </div>

        <div id="ordersContainer" class="space-y-4">
            <p class="text-xs font-bold text-slate-400">読み込み中...</p>
        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const user = await AuthApp.getUser();
            if (!user) {
                alert("ログインが必要です。");
                window.location.href = 'index.html';
                return;
            }
            loadOrders();
        });

        function isHttpUrl(str) {
            if (typeof str !== 'string') return false;
            try {
                const u = new URL(str);
                return u.protocol === 'http:' || u.protocol === 'https:';
            } catch { return false; }
        }

        function isColorHex(str) {
            return typeof str === 'string' && /^#[0-9a-fA-F]{3,8}$/.test(str);
        }

        async function loadOrders() {
            const container = document.getElementById('ordersContainer');
            const orders = await LocalDB.getOrdersAsync();

            if (!orders || orders.length === 0) {
                container.innerHTML = `<div class="bg-white rounded-3xl p-8 text-center text-xs font-bold text-slate-400 border-2 border-slate-100">まだ依頼は届いていません。</div>`;
                return;
            }

            container.innerHTML = orders.map(o => `
                <div class="bg-white rounded-3xl p-6 border-2 border-slate-100 shadow-sm space-y-4">
                    <div class="flex justify-between items-start border-b border-slate-100 pb-3">
                        <div>
                            <span class="text-[10px] font-black bg-pink-100 text-pink-600 px-2.5 py-1 rounded-full">新規依頼</span>
                            <h3 class="text-base font-black text-slate-800 mt-1">${o.client_name} 様</h3>
                            <p class="text-xs font-bold text-slate-400">${o.client_email}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] font-bold text-slate-400 block">${new Date(o.created_at).toLocaleString('ja-JP')}</span>
                            ${o.total_price ? `<span class="text-sm font-black text-pink-500">概算 ¥${Number(o.total_price).toLocaleString()}</span>` : ''}
                        </div>
                    </div>
                    <div class="space-y-2">
                        ${Object.entries(o.answers || {}).map(([key, val]) => `
                            <div class="bg-slate-50 rounded-2xl p-3 border border-slate-100 flex justify-between items-center text-xs gap-3">
                                <span class="font-bold text-slate-500 shrink-0">${key}</span>
                                <span class="font-black text-slate-800 flex items-center gap-2 text-right break-all">
                                    ${isColorHex(val) ? `<span class="w-4 h-4 rounded-full border border-slate-300 inline-block shrink-0" style="background:${val}"></span>` : ''}
                                    ${isHttpUrl(val) ? `<a href="${val}" target="_blank" rel="noopener noreferrer" class="text-pink-500 underline">${val}</a>` : (val || '(未入力)')}
                                </span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
