<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>依頼管理ダッシュボード | フォーム工房</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Zen Maru Gothic', sans-serif; } </style>
</head>
<body class="bg-amber-50/30 text-slate-700 min-h-screen flex flex-col">

    <header class="bg-white/80 backdrop-blur border-b-2 border-amber-100 px-6 py-3 flex justify-between items-center sticky top-0 z-30">
        <div class="flex items-center space-x-3">
            <a href="builder.html" class="bg-pink-500 text-white font-black px-3 py-1.5 rounded-2xl text-lg shadow-sm -rotate-2 inline-block">🎨 フォーム工房</a>
            <span class="text-xs font-bold text-slate-400">届いた依頼の確認</span>
        </div>
        <div class="flex items-center space-x-3">
            <a href="forms.html" class="px-3.5 py-2 text-xs font-black text-slate-700 bg-amber-100 rounded-xl">📋 マイフォーム</a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto w-full p-6 space-y-6">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-black text-slate-800">📥 届いた依頼一覧</h1>
            <button onclick="loadOrders()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold rounded-xl transition">🔄 更新</button>
        </div>

        <div id="ordersContainer" class="space-y-4">
            <p class="text-xs font-bold text-slate-400">読み込み中...</p>
        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const user = await AuthApp.getUser();
            if (!user) {
                alert("ログインが必要です。");
                window.location.href = 'builder.html';
                return;
            }
            loadOrders();
        });

        async function loadOrders() {
            const container = document.getElementById('ordersContainer');
            const orders = await LocalDB.getOrdersAsync();

            if (!orders || orders.length === 0) {
                container.innerHTML = `<div class="bg-white rounded-3xl p-8 text-center text-xs font-bold text-slate-400 border-2 border-slate-100">まだ依頼は届いていません。</div>`;
                return;
            }

            container.innerHTML = orders.map(o => {
                const answersList = Array.isArray(o.answers) ? o.answers : [];
                return `
                    <div class="bg-white rounded-3xl p-6 border-2 border-slate-100 shadow-sm space-y-4">
                        <div class="flex justify-between items-start border-b border-slate-100 pb-3">
                            <div>
                                <span class="text-[10px] font-black bg-pink-100 text-pink-600 px-2.5 py-1 rounded-full">ID: ${o.form_handle || '未設定'}</span>
                                <h3 class="text-base font-black text-slate-800 mt-2">${o.client_name || '名前なし'} 様</h3>
                                <p class="text-xs font-bold text-slate-400">Mail: <a href="mailto:${o.client_email}" class="underline text-pink-500">${o.client_email || '-'}</a></p>
                            </div>
                            <div class="text-right">
                                <span class="text-[10px] font-bold text-slate-400 block mb-1">${new Date(o.created_at).toLocaleString('ja-JP')}</span>
                                <span class="text-xs font-black text-slate-500">概算見積:</span>
                                <span class="text-lg font-black text-pink-600 ml-1">¥${(o.total_price || 0).toLocaleString()}</span>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            ${answersList.map(item => `
                                <div class="bg-slate-50 rounded-2xl p-3 border border-slate-100 text-xs">
                                    <span class="font-bold text-slate-400 block text-[10px]">${item.label}</span>
                                    <span class="font-bold text-slate-800 break-all mt-0.5 inline-block">
                                        ${item.value && item.value.toString().startsWith('#') && item.value.toString().length === 7 ? `<span class="w-3.5 h-3.5 rounded-full border inline-block align-middle mr-1" style="background-color:${item.value}"></span>` : ''}
                                        ${item.value || '(未入力)'}
                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
