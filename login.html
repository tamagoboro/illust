\<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
</head>
<body>
<div class="container" style="max-width:400px; margin-top: 40px;">
  <div class="card">
    <h2>👋 ログイン / アカウント作成</h2>
    <form onsubmit="handleLogin(event)">
      <label>表示名</label>
      <input type="text" id="name" required placeholder="例: あおい">

      <label>メールアドレス</label>
      <input type="email" id="email" required placeholder="user@example.com">

      <label>ユーザーID (handle)</label>
      <input type="text" id="handle" required placeholder="例: aoi">

      <button type="submit" class="btn" style="margin-top: 20px;">ログインして進む</button>
    </form>
  </div>
</div>

<script>
  function handleLogin(e) {
    e.preventDefault();
    LocalDB.setCurrentUser({
      displayName: document.getElementById('name').value,
      email: document.getElementById('email').value,
      handle: document.getElementById('handle').value
    });

    const params = new URLSearchParams(window.location.search);
    window.location.href = params.get('redirect') || 'builder.html';
  }
</script>
</body>
</html>
