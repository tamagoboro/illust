<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お申し込み・お仕事依頼 | フォーム工房</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Zen Maru Gothic', sans-serif; } </style>
</head>
<body class="bg-amber-50/40 text-slate-700 min-h-screen py-8 px-4 flex justify-center items-start">

    <div class="bg-white rounded-[40px] shadow-xl border-4 border-amber-100 max-w-lg w-full p-6 sm:p-8 space-y-6">
        
        <!-- 入力フォームエリア -->
        <form id="orderForm" onsubmit="submitForm(event)" class="space-y-6">
            <div>
                <span id="fBadge" class="text-[10px] font-black px-3 py-1 rounded-full text-white bg-pink-500">受付中</span>
                <h1 id="fTitle" class="text-2xl font-black text-slate-800 mt-2">読み込み中...</h1>
                <p id="fDesc" class="text-xs font-bold text-slate-400 mt-2 whitespace-pre-wrap leading-relaxed"></p>
            </div>

            <!-- 依頼者基本情報 -->
            <div class="bg-slate-50 p-4 rounded-2xl border-2 border-slate-100 space-y-3">
                <h3 class="text-xs font-black text-slate-700">👤 お客様情報</h3>
                <div class="space-y-2">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500">お名前・名義 <span class="text-red-500">*</span></label>
                        <input type="text" id="clientName" required class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold focus:outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500">連絡先メールアドレス <span class="text-red-500">*</span></label>
                        <input type="email" id="clientEmail" required class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold focus:outline-none">
                    </div>
                </div>
            </div>

            <div id="fFields" class="space-y-5"></div>

            <div class="pt-4 border-t-2 border-slate-100 flex justify-between items-center bg-pink-50/50 p-4 rounded-2xl">
                <span class="text-xs font-black text-slate-600">概算見積金額</span>
                <span id="fTotalPrice" class="text-2xl font-black text-pink-600">¥0</span>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-4 bg-pink-500 hover:bg-pink-600 text-white font-black text-base rounded-2xl shadow-lg transition">送信する</button>
        </form>

        <!-- 送信完了画面 (初期非表示) -->
        <div id="thanksArea" class="hidden flex flex-col items-center justify-center text-center p-4 space-y-4 my-auto">
            <div class="w-16 h-16 bg-pink-100 text-pink-500 rounded-full flex items-center justify-center text-3xl shadow-inner animate-bounce">💌</div>
            <h3 class="text-xl font-black text-slate-800">送信が完了しました！</h3>
            <div id="thanksText" class="text-xs font-bold text-slate-600 bg-amber-50/60 border-2 border-amber-200/60 p-4 rounded-2xl whitespace-pre-wrap w-full text-left leading-relaxed"></div>
        </div>

    </div>

    <script>
        let formConfig = null;
        let calculatedTotal = 0;

        window.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const handle = params.get('u') || params.get('id') || 'default';
            
            formConfig = await LocalDB.getFormSettingsAsync(handle);
            if (!formConfig) {
                document.getElementById('fTitle').textContent = "フォームが見つかりません";
                document.getElementById('submitBtn').disabled = true;
                return;
            }

            renderForm();
        });

        function renderForm() {
            document.getElementById('fTitle').textContent = formConfig.title;
            document.getElementById('fDesc').textContent = formConfig.description || '';
            document.getElementById('thanksText').textContent = formConfig.thanks_message || 'ご依頼ありがとうございます！内容を確認のうえ、ご連絡させていただきます。';
            
            const badge = document.getElementById('fBadge');
            if (formConfig.is_accepting === false) {
                badge.textContent = '受付停止中';
                badge.className = 'text-[10px] font-black px-3 py-1 rounded-full text-white bg-slate-400';
                document.getElementById('submitBtn').disabled = true;
                document.getElementById('submitBtn').classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                badge.style.backgroundColor = formConfig.theme_color || '#ec4899';
            }

            const container = document.getElementById('fFields');
            container.innerHTML = (formConfig.fields || []).map((f) => {
                const reqAttr = f.required ? 'required' : '';
                const reqMark = f.required ? '<span class="text-red-500 ml-0.5">*</span>' : '';
                const baseBadge = f.price > 0 ? `<span class="text-[10px] font-black text-pink-500 bg-pink-50 px-2 py-0.5 rounded-full ml-1">+¥${f.price.toLocaleString()}</span>` : '';

                if (f.type === 'note') {
                    return `<div class="bg-amber-50/60 border-2 border-amber-200/60 p-4 rounded-2xl text-xs text-amber-900 font-bold whitespace-pre-wrap"><div class="font-black mb-1 text-amber-800">📌 ${f.label}</div>${f.noteText || ''}</div>`;
                }

                if (f.type === 'faq') {
                    return `<div class="bg-sky-50/60 border-2 border-sky-100 p-4 rounded-2xl space-y-1"><div class="text-xs font-black text-sky-900">❓ ${f.label || '質問'}</div><div class="text-xs font-bold text-slate-600 pl-4 border-l-2 border-sky-300 whitespace-pre-wrap">${f.faqAnswer || ''}</div></div>`;
                }

                let inputHtml = '';
                if (f.type === 'text') {
                    inputHtml = `<input type="text" name="${f.id}" ${reqAttr} class="w-full px-4 py-2.5 bg-slate-50 border-2 border-slate-200 rounded-xl text-xs font-bold focus:outline-none focus:border-pink-400">`;
                } else if (f.type === 'textarea') {
                    inputHtml = `<textarea name="${f.id}" rows="3" ${reqAttr} class="w-full px-4 py-2.5 bg-slate-50 border-2 border-slate-200 rounded-xl text-xs font-bold focus:outline-none focus:border-pink-400"></textarea>`;
                } else if (f.type === 'color') {
                    inputHtml = `<input type="color" name="${f.id}" value="#3b82f6" class="h-10 w-16 rounded-xl border-2 border-slate-200 cursor-pointer">`;
                } else if (f.type === 'radio' || f.type === 'checkbox') {
                    inputHtml = `<div class="space-y-1.5">${(f.options || []).map((opt) => `
                        <label class="flex items-center justify-between text-xs font-bold text-slate-700 bg-slate-50 hover:bg-slate-100 px-3.5 py-2 rounded-xl cursor-pointer transition">
                            <span class="flex items-center space-x-2">
                                <input type="${f.type}" name="${f.id}" value="${opt.label}" ${f.required && f.type === 'radio' ? 'required' : ''} onchange="calculateTotal()" class="accent-pink-500">
                                <span>${opt.label}</span>
                            </span>
                            ${opt.price > 0 ? `<span class="text-[10px] text-pink-500 font-black">+${opt.priceType === 'percent' ? `${opt.price}%` : `¥${opt.price.toLocaleString()}`}</span>` : ''}
                        </label>
                    `).join('')}</div>`;
                }

                return `
                    <div class="space-y-1">
                        <label class="text-xs font-black text-slate-700 flex items-center">${f.label} ${reqMark} ${baseBadge}</label>
                        ${inputHtml}
                    </div>
                `;
            }).join('');

            calculateTotal();
        }

        function calculateTotal() {
            let basePriceTotal = 0;
            let percentAdditions = 0;
            let extraFixedPrice = 0;

            (formConfig.fields || []).forEach(f => {
                if (f.price && f.type !== 'note' && f.type !== 'faq') basePriceTotal += f.price;

                if (f.type === 'radio' || f.type === 'checkbox') {
                    const inputs = document.querySelectorAll(`input[name="${f.id}"]:checked`);
                    inputs.forEach(input => {
                        const opt = (f.options || []).find(o => o.label === input.value);
                        if (opt && opt.price > 0) {
                            if (opt.priceType === 'percent') percentAdditions += opt.price;
                            else extraFixedPrice += opt.price;
                        }
                    });
                }
            });

            calculatedTotal = basePriceTotal + extraFixedPrice + Math.round(basePriceTotal * (percentAdditions / 100));
            document.getElementById('fTotalPrice').textContent = `¥${calculatedTotal.toLocaleString()}`;
        }

        async function submitForm(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const answersArray = [];

            (formConfig.fields || []).forEach(f => {
                if (f.type === 'note' || f.type === 'faq') return;

                if (f.type === 'checkbox') {
                    const vals = formData.getAll(f.id);
                    answersArray.push({
                        label: f.label,
                        value: vals.join(', ') || '(未選択)'
                    });
                } else {
                    answersArray.push({
                        label: f.label,
                        value: formData.get(f.id) || '(未入力)'
                    });
                }
            });

            const orderPayload = {
                creator_user_id: formConfig.user_id,
                form_handle: formConfig.handle,
                client_name: document.getElementById('clientName').value.trim(),
                client_email: document.getElementById('clientEmail').value.trim(),
                answers: answersArray,
                total_price: calculatedTotal,
                created_at: new Date().toISOString()
            };

            const success = await LocalDB.saveOrderAsync(orderPayload);
            if (success) {
                document.getElementById('orderForm').classList.add('hidden');
                document.getElementById('thanksArea').classList.remove('hidden');
            } else {
                alert("送信に失敗しました。時間をおいて再度お試しください。");
            }
        }
        // 例: 注文送信時の処理の中
async function handleSubmit() {
    // 1. 注文データをSupabaseに保存
    const saved = await LocalDB.saveOrderAsync(orderPayload);
    
    if (saved) {
        // 2. クリエイターのDiscord Webhook URLを取得
        const webhookUrl = await LocalDB.getCreatorWebhookUrlAsync(orderPayload.creator_user_id);
        
        // 3. Webhook URLが存在すればDiscordへ通知を送る
        if (webhookUrl) {
            try {
                await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `🔔 **新しい依頼が届きました！**\n**お名前:** ${orderPayload.client_name}\n**金額:** ¥${orderPayload.total_price.toLocaleString()}`
                    })
                });
            } catch (err) {
                console.error("Discord通知失敗:", err);
            }
        }
        alert("送信が完了しました！");
    }
}
    </script>
</body>
</html>
