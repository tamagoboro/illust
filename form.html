<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>依頼フォーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Zen Maru Gothic', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-700 min-h-screen p-4 sm:p-8 flex justify-center items-center">

    <div class="bg-white rounded-[40px] shadow-2xl border-4 border-slate-100 p-6 sm:p-10 max-w-xl w-full space-y-8">
        <!-- 1. フォームヘッダー（タイトル・説明文エリア） -->
        <div>
            <span id="badge" class="text-xs font-black px-4 py-1.5 rounded-full text-white bg-pink-500 inline-block mb-3">受付中</span>
            <h1 id="title" class="text-2xl sm:text-3xl font-black text-slate-800">読み込み中...</h1>
            <p id="desc" class="text-xs sm:text-sm font-bold text-slate-400 mt-2 whitespace-pre-wrap"></p>
        </div>

        <!-- 2. 入力フォーム本体 -->
        <!-- onchange="calculateTotal()" でフォーム内の選択が変化した際にリアルタイム見積もり計算を実行 -->
        <form id="orderForm" onsubmit="submitOrder(event)" onchange="calculateTotal()" class="space-y-6">
            
            <!-- JSで動的に設問をレンダリングするコンテナ -->
            <div id="dynamicFields" class="space-y-6"></div>

            <!-- 概算見積もり金額の表示エリア -->
            <div class="bg-amber-50/80 border-2 border-amber-200/80 rounded-2xl p-4 flex justify-between items-center">
                <span class="text-xs font-black text-slate-600">現在のお見積もり合計（概算）</span>
                <span id="calculatedTotalDisplay" class="text-2xl font-black text-pink-600">¥0</span>
            </div>

            <!-- 依頼者基本情報の入力欄 -->
            <div class="space-y-4 pt-4 border-t-2 border-slate-100">
                <h3 class="text-sm font-black text-slate-800">✉️ 依頼者情報</h3>
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-1">お名前・名義 *</label>
                    <input type="text" id="clientName" required placeholder="山田 太郎" class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-2xl text-xs font-bold focus:outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-1">メールアドレス *</label>
                    <input type="email" id="clientEmail" required placeholder="your@email.com" class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-2xl text-xs font-bold focus:outline-none">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-4 bg-pink-500 hover:bg-pink-600 text-white font-black text-base rounded-2xl shadow-lg transition">送信する</button>
        </form>
    </div>

    <script>
        let currentFormConfig = null;
        
        // URLパラメータ（?u=xxxx）から対象フォームのIDを取得
        const params = new URLSearchParams(window.location.search);
        const handle = params.get('u');

        /**
         * ページ読み込み時の初期化処理
         */
        window.addEventListener('DOMContentLoaded', async () => {
            if (!handle) return alert("フォームURLが無効です。");
            
            // LocalDB (Supabase / LocalStorage) からフォームの設定情報を取得
            currentFormConfig = await LocalDB.getFormSettingsAsync(handle);
            if (!currentFormConfig) return alert("フォームが見つかりません。");

            // フォーム要素の描画と初期金額計算
            renderForm();
            calculateTotal();
        });

        // フォームデータを取得した後の処理
        if (formData.is_accepting === false) {
            // 1. バッジの表示を変更
            const badge = document.getElementById('statusBadge');
            badge.textContent = '現在受付を停止しています';
            badge.className = 'px-3 py-1 text-xs font-black text-white bg-slate-400 rounded-full';

            // 2. 送信ボタンを無効化（あるいは警告表示に変える）
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '🔒 現在ご依頼を受け付けておりません';
            submitBtn.className = 'w-full py-4 bg-slate-300 text-white font-black text-base rounded-2xl cursor-not-allowed';
        }

        /**
         * 取得した設定データを元に、フォーム要素を動的に画面へ描画する関数
         */
        function renderForm() {
            const config = currentFormConfig;
            
            // ヘッダー・カラー設定の反映
            document.getElementById('title').textContent = config.title;
            document.getElementById('desc').textContent = config.description || '';
            document.getElementById('badge').style.backgroundColor = config.theme_color || '#ec4899';
            document.getElementById('submitBtn').style.backgroundColor = config.theme_color || '#ec4899';

            const container = document.getElementById('dynamicFields');
            
            // 各フィールド（設問項目）のレンダリング処理
            container.innerHTML = (config.fields || []).map((f) => {
                const reqAttr = f.required ? 'required' : '';
                let fieldHtml = '';

                // 【分岐1】クリエイター用の表示用テキスト（入力不可の説明枠）
                if (f.type === 'note') {
                    return `
                        <div class="bg-amber-50/60 border-2 border-amber-200/60 p-4 rounded-2xl text-xs text-amber-900 font-bold whitespace-pre-wrap">
                            <div class="font-black mb-1 text-amber-800">📌 ${f.label}</div>
                            ${f.noteText || ''}
                        </div>
                    `;
                }

                // 項目自体に設定された基本加算金額のバッジ表示
                const priceBadge = f.price > 0 ? `<span class="text-[10px] font-black text-pink-500 bg-pink-50 px-2 py-0.5 rounded-full ml-1">+¥${f.price.toLocaleString()}</span>` : '';

                // 【分岐2】テキスト入力（1行）
                if (f.type === 'text') {
                    fieldHtml = `<input type="text" data-field-id="${f.id}" data-price="${f.price || 0}" ${reqAttr} class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-2xl text-xs font-bold">`;
                
                // 【分岐3】長文テキスト入力
                } else if (f.type === 'textarea') {
                    fieldHtml = `<textarea data-field-id="${f.id}" data-price="${f.price || 0}" rows="3" ${reqAttr} class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-100 rounded-2xl text-xs font-bold"></textarea>`;
                
                // 【分岐4】カラーピッカー
                } else if (f.type === 'color') {
                    fieldHtml = `<div class="flex items-center space-x-3"><input type="color" data-field-id="${f.id}" data-price="${f.price || 0}" value="${f.defaultValue || '#3b82f6'}" class="h-10 w-20 rounded-xl border-2 border-slate-100 cursor-pointer"><span class="text-xs font-bold text-slate-400">カラーを選択</span></div>`;
                
                // 【分岐5】単一選択（ラジオボタン）
                } else if (f.type === 'radio') {
                    fieldHtml = `<div class="space-y-2" data-price="${f.price || 0}">${(f.options || []).map(opt => `
                        <label class="flex items-center justify-between text-xs font-bold text-slate-700 bg-slate-50 px-4 py-2.5 rounded-2xl border-2 border-slate-100 cursor-pointer">
                            <span class="flex items-center space-x-2"><input type="radio" name="${f.id}" value="${opt.label}" data-opt-price="${opt.price || 0}" ${reqAttr}> <span>${opt.label}</span></span>
                            ${opt.price > 0 ? `<span class="text-[11px] font-black text-pink-500">+¥${opt.price.toLocaleString()}</span>` : ''}
                        </label>
                    `).join('')}</div>`;
                
                // 【分岐6】複数選択（チェックボックス）
                } else if (f.type === 'checkbox') {
                    fieldHtml = `<div class="space-y-2" data-price="${f.price || 0}">${(f.options || []).map(opt => `
                        <label class="flex items-center justify-between text-xs font-bold text-slate-700 bg-slate-50 px-4 py-2.5 rounded-2xl border-2 border-slate-100 cursor-pointer">
                            <span class="flex items-center space-x-2"><input type="checkbox" name="${f.id}" value="${opt.label}" data-opt-price="${opt.price || 0}"> <span>${opt.label}</span></span>
                            ${opt.price > 0 ? `<span class="text-[11px] font-black text-pink-500">+¥${opt.price.toLocaleString()}</span>` : ''}
                        </label>
                    `).join('')}</div>`;
                }

                // フィールド要素の枠組みを組み立てて返す
                return `
                    <div class="space-y-2">
                        <label class="text-xs font-black text-slate-700 flex items-center">${f.label} ${f.required ? '<span class="text-red-500 ml-0.5">*</span>' : ''} ${priceBadge}</label>
                        ${fieldHtml}
                    </div>
                `;
            }).join('');
        }

        /**
         * 選択された内容に応じて概算見積もり金額を動的に計算する関数
         */
        function calculateTotal() {
            if (!currentFormConfig) return;
            let total = 0;

            (currentFormConfig.fields || []).forEach(f => {
                // 説明文要素は計算対象外
                if (f.type === 'note') return;
                
                // 1. 設問自体の基本料金を無条件で加算（設定されている場合）
                if (f.price) total += f.price;

                // 2. ラジオ・チェックボックスで「チェックが入っている選択肢」の追加金額を加算
                if (f.type === 'radio' || f.type === 'checkbox') {
                    const checkedElements = document.querySelectorAll(`[name="${f.id}"]:checked`);
                    checkedElements.forEach(el => {
                        const optPrice = Number(el.getAttribute('data-opt-price') || 0);
                        total += optPrice;
                    });
                }
            });

            // 計算結果を画面上のDOMに反映（3桁カンマ区切りフォーマット）
            document.getElementById('calculatedTotalDisplay').textContent = `¥${total.toLocaleString()}`;
        }

        /**
         * フォーム送信処理
         */
        async function submitOrder(e) {
            e.preventDefault(); // ページ再読み込み（デフォルト動作）を防止
            const answersArray = [];

            // 各入力要素から回答内容を収集
            (currentFormConfig.fields || []).forEach((f) => {
                if (f.type === 'note') return; // 説明文項目は回答データから除外

                let val = '';
                if (f.type === 'checkbox') {
                    // チェックボックス（複数選択）の場合はカンマ区切り文字列に変換
                    const checked = Array.from(document.querySelectorAll(`[name="${f.id}"]:checked`)).map(el => el.value);
                    val = checked.join(', ');
                } else if (f.type === 'radio') {
                    // ラジオボタンの選択値を取得
                    const checked = document.querySelector(`[name="${f.id}"]:checked`);
                    val = checked ? checked.value : '';
                } else {
                    // 入力フォームからテキスト値を取得
                    const el = document.querySelector(`[data-field-id="${f.id}"]`);
                    if (el) val = el.value;
                }

                answersArray.push({
                    id: f.id,
                    label: f.label,
                    value: val
                });
            });

            // 算出された最終的な「概算見積もり金額」を回答データ構造へ自動挿入
            answersArray.push({
                id: 'estimated_total',
                label: '【自動算出】概算見積もり金額',
                value: document.getElementById('calculatedTotalDisplay').textContent
            });

            // 送信用データの構築
            const orderData = {
                form_id: currentFormConfig.id,
                creator_user_id: currentFormConfig.user_id,
                client_name: document.getElementById('clientName').value,
                client_email: document.getElementById('clientEmail').value,
                answers: answersArray
            };

            // DB保存実行
            const success = await LocalDB.saveOrderAsync(orderData);
            if (success) {
                alert("送信が完了しました！ありがとうございます。");
                document.getElementById('orderForm').reset();
                calculateTotal(); // フォームリセットに伴い金額計算も初期状態へ更新
            } else {
                alert("送信エラーが発生しました。");
            }
        }
    </script>
</body>
</html>
